# Home Assistant Add-on Build Configuration
build_from:
  amd64: ghcr.io/home-assistant/amd64-base-debian:bookworm
  aarch64: ghcr.io/home-assistant/aarch64-base-debian:bookworm

args:
  # Empty = same-origin; nginx proxies /api to the backend
  REACT_APP_BACKEND_URL: ""
  LARO_ADDON_VERSION: "4.0.10"

labels:
  org.opencontainers.image.title: "Laro"
  org.opencontainers.image.description: "Self-hosted family recipe management"
  org.opencontainers.image.source: "https://github.com/Domocn/Laro"
  org.opencontainers.image.licenses: "MIT"
